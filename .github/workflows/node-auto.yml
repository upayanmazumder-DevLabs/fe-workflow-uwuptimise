name: CI - PR & Build Checks

on:
  pull_request:
    branches: ["staging", "prod"]
  push:
    branches: ["staging", "prod"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to build"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm (pinned)
        run: corepack prepare pnpm@9.0.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate workspace config
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            echo "Workspace file detected."
            if ! grep -q "packages:" pnpm-workspace.yaml; then
              echo "Invalid workspace file detected. Removing it."
              rm pnpm-workspace.yaml
            fi
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (if exists)
        run: |
          if pnpm run | grep -q typecheck; then
            pnpm run typecheck
          else
            echo "No typecheck script found. Skipping."
          fi

      - name: Lint (if exists)
        run: |
          if pnpm run | grep -q lint; then
            pnpm run lint
          else
            echo "No lint script found. Skipping."
          fi

      - name: Build
        run: pnpm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.KV_REST_API_READ_ONLY_TOKEN }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_URL: ${{ secrets.KV_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_BUCKET: ${{ secrets.GOOGLE_CLOUD_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
